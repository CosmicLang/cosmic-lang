name: CI

on:
  pull_request:
  push:
    branches:
      - '**'
      - '!main'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Treat warnings as errors in every compiled target and in rustdoc, so no
  # change can silently accumulate lint debt.
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        # Version pinned here as well as in rust-toolchain.toml so a workflow
        # edit cannot drift from the documented policy
        # (docs/development/toolchain-policy.md).
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: 1.99.0
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Format
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace --all-targets

      - name: Doc
        run: cargo doc --workspace --no-deps
